<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="weather-card">

            <h1>🌤️ Weather App</h1>
            <p class="subtitle">Check current weather anywhere</p>

            <div class="search-box">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city (e.g. Pune)"
                >

                <input
                    type="text"
                    id="countryInput"
                    placeholder="Enter country (e.g. India)"
                >

                <button onclick="getWeather()">
                    Search Weather
                </button>

            </div>

            <p id="errorMessage"></p>

            <div id="weatherResult" class="weather-result">

                <h2 id="location"></h2>

                <img id="weatherIcon" src="" alt="Weather Icon">

                <h3 id="temperature"></h3>

                <p id="condition"></p>

                <div class="weather-info">

                    <div>
                        <span>💧</span>
                        <p>Humidity</p>
                        <strong id="humidity"></strong>
                    </div>

                    <div>
                        <span>💨</span>
                        <p>Wind</p>
                        <strong id="wind"></strong>
                    </div>

                    <div>
                        <span>🌡️</span>
                        <p>Feels Like</p>
                        <strong id="feelsLike"></strong>
                    </div>

                    <div>
                        <span>👁️</span>
                        <p>Visibility</p>
                        <strong id="visibility"></strong>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
